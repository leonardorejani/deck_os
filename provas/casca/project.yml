# Prova 0.3: casca nativa com o protótipo dentro, assinada com a conta grátis.
# Gerar o projeto: xcodegen generate --spec provas/casca/project.yml
name: DeckProva
options:
  bundleIdPrefix: com.leonardorejani
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    DEVELOPMENT_TEAM: 3SUC2FNCD5
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  DeckProva:
    type: application
    platform: iOS
    sources:
      - path: Casca
      - path: ../../prototipo
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardorejani.deck.prova
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deck prova
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
