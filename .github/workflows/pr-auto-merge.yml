name: PR Auto-Merge (Tier S)

# Auto-approves + auto-merges ONLY Tier S PRs (inert content):
# docs, chronology, fronts. Fail-safe by exclusion: 1 file outside the
# allowlist → aborts, falls back to the human flow. See .claude/rules/07-safe-merge.md.
#
# Triggered via workflow_run after CI completes (ensures CI is green first).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # O if acima só deixa passar PR de branch do próprio repositório, então o runner próprio é seguro.
    runs-on: ${{ fromJSON(vars.RUNNER_LEVE || '["self-hosted","leve"]') }}
    steps:
      - name: Resolve PR
        id: pr
        run: |
          set -e
          # O nome da branch é dado externo: vai por variável de ambiente, nunca dentro do script.
          PR=$(gh pr list -R "$GITHUB_REPOSITORY" \
            --head "$HEAD_BRANCH" \
            --state open --json number,isDraft,author -q '.[0]')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "skip=1" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "number=$(echo "$PR" | jq -r .number)" >> $GITHUB_OUTPUT
          echo "draft=$(echo "$PR" | jq -r .isDraft)" >> $GITHUB_OUTPUT
          echo "author=$(echo "$PR" | jq -r .author.login)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}

      - name: Gate (allowlist + draft + author + secrets)
        id: gate
        if: steps.pr.outputs.skip != '1'
        run: |
          set -e
          N=${{ steps.pr.outputs.number }}
          if [ "${{ steps.pr.outputs.draft }}" = "true" ]; then
            echo "Draft, skip."; echo "ok=0" >> $GITHUB_OUTPUT; exit 0
          fi
          case "${{ steps.pr.outputs.author }}" in
            leonardorejani|app/github-actions) ;;
            *) echo "Author outside the allowlist."
               echo "ok=0" >> $GITHUB_OUTPUT; exit 0;;
          esac
          BAD=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|.planning/workstreams/*|build-log.md|.project-structure.md|.todos-report.md) ;;
              *) echo "Outside Tier S: $f"; BAD=1;;
            esac
          done < <(gh pr view "$N" -R "$GITHUB_REPOSITORY" --json files -q '.files[].path')
          if [ "$BAD" = "1" ]; then
            echo "Diff touches Tier H. Human flow."
            echo "ok=0" >> $GITHUB_OUTPUT; exit 0
          fi
          if gh pr diff "$N" -R "$GITHUB_REPOSITORY" \
             | grep -qE 'sk-ant-|pk_live_|sbp_|ghp_|EAA[A-Za-z0-9]{60,}'; then
            echo "Secret in diff. Blocked."
            echo "ok=0" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "ok=1" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve + squash merge
        if: steps.gate.outputs.ok == '1'
        run: |
          set -e
          N=${{ steps.pr.outputs.number }}
          gh pr review "$N" -R "$GITHUB_REPOSITORY" --approve \
            --body "Tier S (inert content). CI green, no secret, trusted author. Auto-approved (07-safe-merge.md)."
          gh pr merge "$N" -R "$GITHUB_REPOSITORY" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
