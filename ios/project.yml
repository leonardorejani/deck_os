# Deck para iPhone (fase 5). Gerar o projeto: xcodegen generate --spec ios/project.yml
# A página do painel entra em ios/Pagina (scripts/empacotar-painel.sh, ignorada no git).
name: Deck
options:
  bundleIdPrefix: com.leonardorejani
  deploymentTarget:
    iOS: "16.4"
packages:
  DeckCasca:
    path: Pacote
settings:
  base:
    DEVELOPMENT_TEAM: 3SUC2FNCD5
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Deck:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
      - path: Web
        type: folder
        buildPhase: resources
      - path: ../prototipo/nativo.css
        buildPhase: resources
      - path: Pagina
        type: folder
        buildPhase: resources
    dependencies:
      - package: DeckCasca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardorejani.deck.iphone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deck
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "O Deck usa o Bluetooth para achar o seu Mac e mostrar o painel sem cabo nem Wi-Fi."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
